apiVersion: apps/v1
kind: Deployment
metadata:
  name: civimind
  namespace: civimind

spec:
  replicas: 3

  selector:
    matchLabels:
      app: civimind

  template:
    metadata:
      labels:
        app: civimind
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"

    spec:
      containers:
        - name: civimind
          image: civimind:final
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"

          volumeMounts:
            - name: temp
              mountPath: /tmp

      volumes:
        - name: temp
          emptyDir: {}
