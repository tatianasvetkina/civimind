apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: civimind-ingress
  namespace: civimind
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: civimind
                port:
                  number: 80
