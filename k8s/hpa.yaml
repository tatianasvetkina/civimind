apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: civimind-hpa
  namespace: civimind
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: civimind
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
